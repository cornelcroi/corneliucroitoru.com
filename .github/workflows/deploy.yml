name: Deploy to GitHub Pages

# Two ways in, nothing automatic:
#   - a push to main deploys the site;
#   - run by hand (Actions → Deploy to GitHub Pages → Run workflow): with an article it publishes that
#     draft now (removes draft: true, sets the date, commits), then deploys. Without one, it just deploys.
#     Every run shows the publishing table (live / draft) in its summary.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      article:
        description: "Draft to publish now (its slug, e.g. evaluating-llm-output-validate-repair-scrub). Empty: just deploy."
        required: false
        default: ""
      date:
        description: "Date shown on the article, YYYY-MM-DD. Empty: today. Not in the future."
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.article != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Publish the article
        env:
          ARTICLE: ${{ inputs.article }}
          DATE: ${{ inputs.date }}
        run: node scripts/publishing.mjs publish "$ARTICLE" "$DATE"
      - name: Commit
        env:
          ARTICLE: ${{ inputs.article }}
          DATE: ${{ inputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Publish $ARTICLE"
          git push

  build:
    needs: publish
    # Runs whether or not an article was published, but never after a failed publish.
    if: ${{ !cancelled() && needs.publish.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main # includes the publishing commit, when there is one
      - name: Publishing table
        run: node scripts/publishing.mjs status >> "$GITHUB_STEP_SUMMARY"
      - uses: withastro/action@v5
        with:
          node-version: 24

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
